[main]
font=Roboto:size=13
use-bold=yes
dpi-aware=auto
prompt="    "
placeholder=Search apps…
icon-theme=Adwaita
icons-enabled=yes
terminal=ghostty -e
layer=overlay
keyboard-focus=on-demand
width=46
lines=11
horizontal-pad=24
vertical-pad=18
inner-pad=10
image-size-ratio=0.45
line-height=27
letter-spacing=0
exit-on-keyboard-focus-loss=yes

[colors]
background=0b1020f2
text=e6edf7ff
prompt=6ee7faff
placeholder=aeb9d6cc
input=e6edf7ff
match=6ee7faff
selection=202a44ff
selection-text=ffffffff
selection-match=ff7a90ff
counter=aeb9d6cc
border=6ee7facc

[border]
width=2
radius=14

[dmenu]
exit-immediately-if-empty=yes
